[project]
name = "ruixue-agent"
version = "0.1.0"
description = "瑞雪智能体 —— 从零正规搭建的 LangGraph agent（配置驱动、多模型）"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.15",
    "langchain-core==1.3.3",
    "langchain-openai==1.2.1",
    "langgraph==1.1.9",
    "pyyaml>=6.0",          # 读 config.yaml
    "python-dotenv>=1.0",   # 从 .env 读 API key
    "langchain-deepseek>=1.0.1",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.14.2",
    "cryptography>=49.0.0",
    "pymupdf>=1.28.0",
    "ftfy>=6.3.1",
    "langchain-text-splitters>=1.1.2",
    "pylatexenc>=2.10",
    "datasketch>=2.0.0",
    "pymilvus>=3.0.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "torch>=2.6",
    "jieba>=0.42.1",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg-pool>=3.3.1",
    "slowapi>=0.1.10",
    "pandas>=2.0",          # 预测模型:训练/服务的数据处理
    "scikit-learn>=1.9",    # 预测模型:插补/树模型/交叉验证(显式锁定,模型可复现)
    "xgboost>=2.0",         # 预测模型:DR 基线(对齐论文)
    "lightgbm>=4.0",        # 预测模型:benchmark 候选(强、快)
    "tabpfn>=8.1.0",
    "shap>=0.51.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.8",
    "langchain-mcp-adapters>=0.3.0",
    "redis>=5.0",
    "ddgs>=9.15.0",
]

# ── 开发依赖组 ────────────────────────────────────────────────────
# 只在【开发/CI】需要的工具,不进生产镜像。
# `uv sync` 默认会装它们(本地/CI 都有);`uv sync --no-dev` 不装(打生产镜像用)。
[dependency-groups]
dev = [
    "netcdf4>=1.7.4",
    "pytest>=8.0",          # 测试框架
    "rasterio>=1.4.4",
    "ruff>=0.10",           # 代码规范检查 + 格式化
    "xarray>=2026.7.0",
]

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic 的迁移文件是【工具自动生成】的,不该用我们的规范去卡它。
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# 开哪些检查规则(每个字母是一类):
#   E/W = 代码风格(pycodestyle)   F = 潜在 bug/未用变量(pyflakes)
#   I   = import 排序(isort)       UP = 用更新的语法写法(pyupgrade)
#   B   = 常见坑(bugbear,如可变默认参数)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 是一次性/手动运维脚本,不是生产代码,放宽:
#   E402=允许 sys.path 设置后再 import  E501=长行  B007=循环变量没用到
"scripts/**" = ["E402", "E501", "B007"]
# 测试:允许长的断言消息;B017=允许 pytest.raises(Exception) 这种宽异常断言
"tests/**" = ["E501", "B017"]
# FastAPI 的依赖注入【必须】写在参数默认值里(Depends/Security),
# B008"别在默认值里调函数"对它是误报 —— 官方文档就是这么写的。
"ruixue_app/**" = ["B008"]

# Windows 下 PyPI 默认的 torch 是 CPU 构建,CUDA 版要从 pytorch 官方源装。
# cu126 对应本机 3090。
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
# 只有 sources 里点名的包走这个源,其余仍走 PyPI。
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

# 项目自身以 editable 模式装进 venv,alembic 等外部工具才能 import 到包。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruixue_agent", "ruixue_app"]

[tool.pytest.ini_options]
# 只在 tests/ 里找测试。scripts/ 下有手动测试脚本(test_stream.py 等),
# 名字也叫 test_*,但它们要连真服务、不是单元测试 —— 不锁范围会被误收集、报错。
testpaths = ["tests"]
# Windows 上 pytest 默认在系统临时目录用 symlink，清理时常撞权限错误(WinError 5)。
# 显式指定一个【项目内】的临时目录，pytest 就不再走 symlink 那套，绕开这个坑。
addopts = "--basetemp=.pytest_tmp"
