# Alembic config.
#
# NOTE: keep this file ASCII-only. Alembic reads it with configparser using the
# system locale encoding (GBK on Windows), so non-ASCII comments raise
# UnicodeDecodeError. Chinese explanations live in env.py instead.
#
# sqlalchemy.url is intentionally EMPTY: env.py injects the real URL from
# docker/.env at runtime, so the password never lands in a git-tracked file.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
