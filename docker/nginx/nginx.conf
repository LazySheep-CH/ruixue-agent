# Nginx 主配置 —— 生产环境的唯一公网入口。
#
# 为什么要有 nginx,不让浏览器直连 uvicorn:
#   1. 一个入口:前端(3000)和后端(8000)在同一个域名下,浏览器看来是同源,
#      不用配 CORS,也不用把两个端口都暴露出去。
#   2. TLS 终结:证书只在 nginx 一处管理,后端永远说 HTTP,不用每个服务配一遍。
#   3. 它比 uvicorn 更适合干"面向公网的脏活":慢连接、超大请求体、静态文件、
#      连接数管理。uvicorn 官方也明确说生产要放在反向代理后面。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里带上真实耗时和上游耗时 —— 排查"慢"的时候要能分清是 nginx 慢还是后端慢。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                      '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 不回显版本号:少给扫描器一条线索(已知版本 = 可以直接翻它的 CVE)。
    server_tokens   off;

    # 请求体上限。默认 1MB,对话请求够用;将来做文档上传要按需调大。
    client_max_body_size 10m;

    gzip              on;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    # SSE 是 text/event-stream,【故意不压缩】:压缩会引入缓冲,事件就不能逐条推出去了。

    include /etc/nginx/conf.d/*.conf;
}
