# 站点配置:一个域名下,前端和后端各占一段路径。
#
#   /            → 前端(Next.js,3000)
#   /api/...     → 后端(FastAPI,8000),转发时【去掉 /api 前缀】
#
# 后端不用改一行代码就能被反代:前端在开发期本来就是靠 next.config 的 rewrites
# 把 /api/* 代理到 8000,这里只是把同一件事换成 nginx 来做。
#
# ── 为什么不用 upstream 块,而是把地址写成变量 ──
# nginx 在【启动时】把 upstream 里的主机名解析成 IP,然后一直用那个 IP。
# 容器重建(升级、崩溃重启)时 IP 会变,nginx 却还在往旧 IP 打 —— 表现为
# 502 而且自己不会恢复,非得重启 nginx。实测 nginx -t 也会因为解析不到
# app 主机名直接失败,说明它确实是启动期解析。
# 把地址放进变量并配 resolver,nginx 就改成【每次请求前按 TTL 重新解析】,
# 容器换 IP 也能自愈。代价是失去到上游的 keepalive 复用,这个量级下不值一提。
#
# 127.0.0.11 是 Docker 内置 DNS 的固定地址(每个自定义网络里都有)。

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 上游解析不出来时用 502 而不是挂着,让健康检查能快速发现
    resolver_timeout 5s;

    # 让 certbot 能做 HTTP-01 验证(申请/续期证书时用),见文件末尾的 HTTPS 说明。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── 后端 API ───────────────────────────────────────────────
    location /api/ {
        set $backend "app:8000";
        # 去掉 /api 前缀:/api/chat → 后端收到 /chat。
        # break 表示改完 URI 就地继续,不重新走一遍 location 匹配。
        # (用变量做 proxy_pass 时 nginx 不会自动帮你截前缀,必须显式 rewrite。)
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 后端限流按用户 ID,但日志和将来的 IP 级封禁要看真实来源 IP。
        # 不透传的话,所有请求在后端看来都来自 nginx 容器这一个 IP。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠ SSE 三件套 —— 少一件,流式输出就会"憋到最后一次性吐出来"。
        #
        #   proxy_buffering off  nginx 默认把上游响应攒够一块再发给客户端。
        #                        对普通 JSON 这是优化,对 SSE 是灾难:用户盯着
        #                        转圈几十秒,然后答案唰一下全出来 —— 流式白做了。
        #   X-Accel-Buffering    双保险,显式声明这条响应不要缓冲。
        #   read_timeout 长      一次 agent 运行可能几分钟(调工具、查 RAG),
        #                        默认 60s 会把还在生成的连接掐断。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 前端 ───────────────────────────────────────────────────
    location / {
        set $frontend "web:3000";
        proxy_pass http://$frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 的 WebSocket(开发期 HMR);生产用不到,留着无害。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_upgrade;
    }
}

# ── HTTPS 怎么开 ────────────────────────────────────────────────
#
# 没写死在这里,是因为它需要【你自己的域名和证书】—— 硬编码一个假域名只会让
# nginx 起不来。有域名后按这三步:
#
#   1. 域名 A 记录指向服务器 IP
#   2. 申请证书(在项目根目录执行,80 端口必须已经通):
#        docker run --rm -v ./docker/nginx/certs:/etc/letsencrypt \
#          -v ./docker/nginx/www:/var/www/certbot certbot/certbot certonly \
#          --webroot -w /var/www/certbot -d 你的域名 --email 你的邮箱 --agree-tos
#   3. 把同目录下的 app-tls.conf.example 改名为 app-tls.conf,替换里面的域名,
#      重载:docker compose exec nginx nginx -s reload
#
# 续期:证书 90 天到期,加一条 crontab 每月跑一次 certbot renew。
