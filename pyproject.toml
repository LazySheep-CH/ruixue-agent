[project]
name = "ruixue-agent"
version = "0.1.0"
description = "瑞雪智能体 —— 从零正规搭建的 LangGraph agent（配置驱动、多模型）"
requires-python = ">=3.11"
# 版本锁成和 参考架构 一样，这样你在 参考架构 学到的 API 和这里完全一致。
dependencies = [
    "langchain==1.2.15",
    "langchain-core==1.3.3",
    "langchain-openai==1.2.1",
    "langgraph==1.1.9",
    "pyyaml>=6.0",          # 读 config.yaml
    "python-dotenv>=1.0",   # 从 .env 读 API key
    "pytest>=8.0",          # 测试（我们要正规地写测试）
]

[tool.pytest.ini_options]
# Windows 上 pytest 默认在系统临时目录用 symlink，清理时常撞权限错误(WinError 5)。
# 显式指定一个【项目内】的临时目录，pytest 就不再走 symlink 那套，绕开这个坑。
addopts = "--basetemp=.pytest_tmp"
