[project]
name = "ruixue-agent"
version = "0.1.0"
description = "瑞雪智能体 —— 从零正规搭建的 LangGraph agent（配置驱动、多模型）"
requires-python = ">=3.11"
# 版本锁成和 参考架构 一样，这样你在 参考架构 学到的 API 和这里完全一致。
dependencies = [
    "langchain==1.2.15",
    "langchain-core==1.3.3",
    "langchain-openai==1.2.1",
    "langgraph==1.1.9",
    "pyyaml>=6.0",          # 读 config.yaml
    "python-dotenv>=1.0",   # 从 .env 读 API key
    "pytest>=8.0",          # 测试（我们要正规地写测试）
    "langchain-deepseek>=1.0.1",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.14.2",
    "cryptography>=49.0.0",
    "pymupdf>=1.28.0",
    "ftfy>=6.3.1",
    "langchain-text-splitters>=1.1.2",
    "pylatexenc>=2.10",
    "datasketch>=2.0.0",
    "pymilvus>=3.0.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "torch>=2.6",           # 显式声明:否则被 sentence-transformers 顺带装成 CPU 版
    "jieba>=0.42.1",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg-pool>=3.3.1",
]

# ── 让 torch 用上 GPU ────────────────────────────────────────────────
# 踩过的坑:PyPI 上 Windows 的默认 torch wheel 是【CPU-only 构建】(版本号带 +cpu)。
# sentence-transformers 顺带把它拉进来 → 机器上插着 RTX 3090,torch 却连卡都看不见,
# torch.cuda.is_available() 一直是 False。它不报错,只是默默用 CPU 慢慢磨。
#
# CUDA 版的 wheel 只在 PyTorch 自己的源上,得显式指过去。
#
# 为什么是 cu126:3090 是 Ampere 架构,cu126 支持得最稳。驱动 595.95 支持到 CUDA 13.2,
# 而 CUDA 驱动向后兼容 —— 新驱动能跑老 CUDA 编译的程序,所以不用追最新。
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
# explicit = true 很关键:只有下面 tool.uv.sources 里点名的包才从这个源拿,
# 其余依赖照旧走 PyPI。不加的话 uv 会拿它当通用源找所有包,解析会乱。
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

# 让本项目自己成为一个【可安装的包】。
# 之前没有这段 → ruixue_agent 不在 venv 里 → 每个 script 都得写
#     sys.path.insert(0, ...)
# 这种 hack。加上之后 `uv sync` 会把项目以 editable 模式装进 venv:
# 改代码立刻生效(不用重装),而 import ruixue_agent 在任何地方都能用
# —— 包括 alembic 这种由第三方工具启动、我们插不进 sys.path 的进程。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruixue_agent"]

[tool.pytest.ini_options]
# Windows 上 pytest 默认在系统临时目录用 symlink，清理时常撞权限错误(WinError 5)。
# 显式指定一个【项目内】的临时目录，pytest 就不再走 symlink 那套，绕开这个坑。
addopts = "--basetemp=.pytest_tmp"
